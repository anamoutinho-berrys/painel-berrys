<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berry's – Painel Interno</title>
  <meta name="theme-color" content="#0D2E3F">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='26' fill='%2345B9E6'/%3E%3Ctext x='50' y='71' font-family='Verdana,sans-serif' font-size='58' font-weight='bold' fill='%230D2E3F' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
  <!-- Fontes servidas pelo próprio domínio (assets/fonts) — sem depender do
       Google Fonts, que pode ser bloqueado em rede corporativa. Ver core.css. -->
  <link rel="preload" href="assets/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/core.css">
</head>
<body>

<div class="topbar">
  <!-- Logotipo oficial reconstruído em CSS (cápsula + wordmark), ver .brand-mark -->
  <div class="brand">
    <div class="brand-mark">
      <div class="bm-pill">BERRY'S</div>
      <div class="bm-sub">ICED FOOD</div>
    </div>
  </div>
  <nav class="tabs-nav">
    <button class="tab-btn active" onclick="goTab('saldos',this)">💰 Saldos <span class="badge">LIVE</span></button>
    <button class="tab-btn" onclick="goTab('relatorio',this)">📈 Dash Unidades <span class="badge">LIVE</span></button>
    <button class="tab-btn" onclick="goTab('brasil',this)">🇧🇷 Dash Franqueadora <span class="badge">LIVE</span></button>
    <button class="tab-btn" onclick="goTab('cronograma',this)">📅 Cronograma IG <span class="badge">LIVE</span></button>
    <button class="tab-btn" onclick="goTab('inauguracoes',this)">🎉 Próximas Inaugurações</button>
  </nav>
  <div class="srv-status"><div class="srv-dot"></div>API conectada</div>
</div>

<!-- Cada <div id="tab-*"> começa vazio: o conteúdo de tabs/<aba>.html é injetado
     sob demanda pelo loadTab() em core.js, na primeira vez que a aba é aberta. -->
<div id="tab-saldos" class="tab-page active"></div>
<div id="tab-relatorio" class="tab-page"></div>
<div id="tab-brasil" class="tab-page"></div>
<div id="tab-cronograma" class="tab-page"></div>
<div id="tab-inauguracoes" class="tab-page"></div>

<!-- Bibliotecas compartilhadas: sempre carregadas -->
<script src="assets/core.js"></script>
<script src="assets/objectives.js"></script>

<script>
// ============================================================================
// Loader de abas — SÓ mexa aqui se for mudar o mecanismo de troca de abas em
// si. Conteúdo/lógica de cada aba fica isolado em tabs/<aba>.html + .js.
// ============================================================================

// chave da aba (a mesma usada em goTab/onclick) -> nome-base do arquivo em tabs/
const TAB_FILE = {
  'saldos':        'saldos',
  'relatorio':      'relatorio',
  'brasil':         'brasil',
  'cronograma':     'cronograma',
  'inauguracoes':   'inauguracoes',
};

const loadedTabs = new Set();

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject(new Error('Falha ao carregar ' + src));
    document.body.appendChild(el);
  });
}

async function loadTab(key) {
  if (loadedTabs.has(key)) return;
  const file = TAB_FILE[key];
  const container = document.getElementById('tab-' + key);
  try {
    const html = await fetch(`tabs/${file}.html`).then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    });
    container.innerHTML = html;
    await loadScript(`tabs/${file}.js`);
    loadedTabs.add(key);
    const initFn = window['init_' + file.replace(/-/g, '_')];
    if (typeof initFn === 'function') initFn();
  } catch (e) {
    container.innerHTML = `<div style="padding:40px;text-align:center;color:#e94560;font-weight:800;">
      ⚠️ Não foi possível carregar esta aba (${e.message}).<br>
      <span style="font-weight:600;font-size:12px;color:#999;">Isto acontece se o painel for aberto direto do arquivo (file://) —
      sirva a pasta por um servidor http (GitHub Pages, ou "python3 -m http.server").</span>
    </div>`;
    console.error('[loadTab]', key, e);
  }
}

async function goTab(name, btn) {
  if (!TAB_FILE[name]) name = 'saldos';
  document.querySelectorAll('.tab-page').forEach(e => e.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('active'));
  await loadTab(name);
  document.getElementById('tab-' + name).classList.add('active');
  if (!btn) btn = document.querySelector(`[onclick="goTab('${name}',this)"]`);
  if (btn) btn.classList.add('active');
  if (history.replaceState) history.replaceState(null, '', '#' + name);
}

// Deep-link: abrir direto numa aba específica via #chave-da-aba na URL
// (ex.: index.html#criativos), pra poder mandar o link caindo direto nela.
document.addEventListener('DOMContentLoaded', () => {
  const key = location.hash.replace('#', '');
  goTab(TAB_FILE[key] ? key : 'saldos');
});
</script>
</body>
</html>
